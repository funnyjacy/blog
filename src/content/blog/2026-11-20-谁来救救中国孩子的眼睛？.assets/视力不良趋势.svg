<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="760" fill="#fcfcfb"/>

  <!-- ===== 面板 1:全体(7-22岁) 1985–2014 ===== -->
  <text x="24" y="30" font-size="15" font-weight="600" fill="#0b0b0b">全体学生视力不良检出率（1985–2014，7–22 岁）</text>

  <g stroke="#e1e0d9" stroke-width="1">
    <line x1="70" y1="120" x2="830" y2="120"/>
    <line x1="70" y1="180" x2="830" y2="180"/>
    <line x1="70" y1="240" x2="830" y2="240"/>
  </g>
  <g font-size="11" fill="#898781" text-anchor="end">
    <text x="62" y="304">0</text>
    <text x="62" y="244">25</text>
    <text x="62" y="184">50</text>
    <text x="62" y="124">75</text>
    <text x="62" y="64">100%</text>
  </g>

  <!-- 1985→2000 实线;2000→2014 虚线(2005/2010 总体值未单独公布) -->
  <polyline points="70,217.8 330,180.0 461,172.4" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round"/>
  <polyline points="461,172.4 828,140.2" fill="none" stroke="#2a78d6" stroke-width="2" stroke-dasharray="6 5"/>
  <g fill="#2a78d6"><circle cx="70" cy="217.8" r="5"/><circle cx="330" cy="180.0" r="5"/><circle cx="461" cy="172.4" r="5"/><circle cx="828" cy="140.2" r="5"/></g>

  <line x1="70" y1="300" x2="830" y2="300" stroke="#c3c2b7" stroke-width="1"/>
  <g font-size="12" fill="#52514e" text-anchor="middle">
    <text x="70" y="322">1985</text>
    <text x="330" y="322">1995</text>
    <text x="461" y="322">2000</text>
    <text x="828" y="322">2014</text>
  </g>
  <g font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">
    <text x="70"  y="206">34.26%</text>
    <text x="330" y="168">超 50%</text>
    <text x="461" y="194">53.18%</text>
    <text x="828" y="130">66.6%</text>
  </g>

  <!-- ===== 面板 2:分学段 2000–2014 ===== -->
  <text x="24" y="380" font-size="15" font-weight="600" fill="#0b0b0b">分学段视力不良检出率（2000–2014）</text>
  <g font-size="12" fill="#52514e">
    <rect x="560" y="362" width="10" height="10" rx="2" fill="#2a78d6"/><text x="576" y="372">小学</text>
    <rect x="636" y="362" width="10" height="10" rx="2" fill="#eb6834"/><text x="652" y="372">初中</text>
    <rect x="712" y="362" width="10" height="10" rx="2" fill="#1baf7a"/><text x="728" y="372">高中</text>
    <rect x="788" y="362" width="10" height="10" rx="2" fill="#4a3aa7"/><text x="804" y="372">大学</text>
  </g>

  <g stroke="#e1e0d9" stroke-width="1">
    <line x1="70" y1="480" x2="830" y2="480"/>
    <line x1="70" y1="540" x2="830" y2="540"/>
    <line x1="70" y1="600" x2="830" y2="600"/>
  </g>
  <g font-size="11" fill="#898781" text-anchor="end">
    <text x="62" y="664">0</text>
    <text x="62" y="604">25</text>
    <text x="62" y="544">50</text>
    <text x="62" y="484">75</text>
    <text x="62" y="424">100%</text>
  </g>

  <!-- 小学 -->
  <polyline points="170,604.3 380,584.0 590,561.9 800,550.3" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round"/>
  <g fill="#2a78d6"><circle cx="170" cy="604.3" r="5"/><circle cx="380" cy="584.0" r="5"/><circle cx="590" cy="561.9" r="5"/><circle cx="800" cy="550.3" r="5"/></g>
  <!-- 初中 -->
  <polyline points="170,541.4 380,520.6 590,498.4 800,481.4" fill="none" stroke="#eb6834" stroke-width="2" stroke-linejoin="round"/>
  <g fill="#eb6834"><circle cx="170" cy="541.4" r="5"/><circle cx="380" cy="520.6" r="5"/><circle cx="590" cy="498.4" r="5"/><circle cx="800" cy="481.4" r="5"/></g>
  <!-- 高中 -->
  <polyline points="170,486.0 380,477.6 590,469.9 800,460.1" fill="none" stroke="#1baf7a" stroke-width="2" stroke-linejoin="round"/>
  <g fill="#1baf7a"><circle cx="170" cy="486.0" r="5"/><circle cx="380" cy="477.6" r="5"/><circle cx="590" cy="469.9" r="5"/><circle cx="800" cy="460.1" r="5"/></g>
  <!-- 大学 -->
  <polyline points="170,464.2 380,461.6 590,456.7 800,452.6" fill="none" stroke="#4a3aa7" stroke-width="2" stroke-linejoin="round"/>
  <g fill="#4a3aa7"><circle cx="170" cy="464.2" r="5"/><circle cx="380" cy="461.6" r="5"/><circle cx="590" cy="456.7" r="5"/><circle cx="800" cy="452.6" r="5"/></g>

  <line x1="70" y1="660" x2="830" y2="660" stroke="#c3c2b7" stroke-width="1"/>
  <g font-size="12" fill="#52514e" text-anchor="middle">
    <text x="170" y="682">2000</text>
    <text x="380" y="682">2005</text>
    <text x="590" y="682">2010</text>
    <text x="800" y="682">2014</text>
  </g>

  <!-- 起点(2000)标注 -->
  <g font-size="12" fill="#52514e">
    <text x="156" y="610" text-anchor="end">小学 23.2%</text>
    <text x="156" y="546" text-anchor="end">初中 49.4%</text>
    <text x="156" y="494" text-anchor="end">高中 72.5%</text>
    <text x="156" y="462" text-anchor="end">大学 81.6%</text>
  </g>
  <!-- 终点(2014)标注 -->
  <g font-size="12" font-weight="600" fill="#0b0b0b">
    <text x="812" y="556">小学 45.7%</text>
    <text x="812" y="498">初中 74.4%</text>
    <text x="812" y="476">高中 83.3%</text>
    <text x="812" y="448">大学 86.4%</text>
  </g>

  <text x="24" y="736" font-size="11" fill="#898781">1985 年数据来自首次全国学生体质与健康调研（人民日报 1988 年报道）；2005、2010 年全国总体值未单独公布，虚线段表示间隔；分学段数据来自教育部历次调研公告</text>
</svg>
