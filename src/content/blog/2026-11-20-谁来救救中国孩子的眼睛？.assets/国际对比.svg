<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="360" fill="#fcfcfb"/>

  <text x="24" y="30" font-size="15" font-weight="600" fill="#0b0b0b">全球分区域近视率对比（2000–2050）</text>
  <text x="24" y="48" font-size="11" fill="#898781">Holden 等《Ophthalmology》2016 年 meta 分析（145 项研究、210 万人，统一按 -0.50D 口径）；2020 年后为模型预测</text>

  <!-- 图例 -->
  <g font-size="12" fill="#52514e">
    <rect x="470" y="20" width="10" height="10" rx="2" fill="#2a78d6"/><text x="486" y="30">东亚</text>
    <rect x="552" y="20" width="10" height="10" rx="2" fill="#eb6834"/><text x="568" y="30">美国</text>
    <rect x="634" y="20" width="10" height="10" rx="2" fill="#1baf7a"/><text x="650" y="30">西欧</text>
  </g>

  <g stroke="#e1e0d9" stroke-width="1">
    <line x1="70" y1="127.5" x2="830" y2="127.5"/>
    <line x1="70" y1="185"   x2="830" y2="185"/>
    <line x1="70" y1="242.5" x2="830" y2="242.5"/>
  </g>
  <g font-size="11" fill="#898781" text-anchor="end">
    <text x="62" y="304">0</text>
    <text x="62" y="247">25</text>
    <text x="62" y="189">50</text>
    <text x="62" y="132">75</text>
    <text x="62" y="74">100%</text>
  </g>

  <!-- 东亚:2000→2020 实线(估计值),2020→2050 虚线(预测) -->
  <polyline points="100,210.8 236,191.9 372,181.3" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round"/>
  <polyline points="372,181.3 508,169.1 644,158.8 780,149.8" fill="none" stroke="#2a78d6" stroke-width="2" stroke-dasharray="6 5"/>
  <g fill="#2a78d6"><circle cx="100" cy="210.8" r="5"/><circle cx="236" cy="191.9" r="5"/><circle cx="372" cy="181.3" r="5"/><circle cx="508" cy="169.1" r="5"/><circle cx="644" cy="158.8" r="5"/><circle cx="780" cy="149.8" r="5"/></g>

  <!-- 美国 -->
  <polyline points="100,234.9 236,220.7 372,203.2" fill="none" stroke="#eb6834" stroke-width="2" stroke-linejoin="round"/>
  <polyline points="372,203.2 508,188.5 644,175.8 780,165.7" fill="none" stroke="#eb6834" stroke-width="2" stroke-dasharray="6 5"/>
  <g fill="#eb6834"><circle cx="100" cy="234.9" r="5"/><circle cx="236" cy="220.7" r="5"/><circle cx="372" cy="203.2" r="5"/><circle cx="508" cy="188.5" r="5"/><circle cx="644" cy="175.8" r="5"/><circle cx="780" cy="165.7" r="5"/></g>

  <!-- 西欧 -->
  <polyline points="100,249.6 236,234.5 372,215.6" fill="none" stroke="#1baf7a" stroke-width="2" stroke-linejoin="round"/>
  <polyline points="372,215.6 508,197.7 644,182.7 780,170.7" fill="none" stroke="#1baf7a" stroke-width="2" stroke-dasharray="6 5"/>
  <g fill="#1baf7a"><circle cx="100" cy="249.6" r="5"/><circle cx="236" cy="234.5" r="5"/><circle cx="372" cy="215.6" r="5"/><circle cx="508" cy="197.7" r="5"/><circle cx="644" cy="182.7" r="5"/><circle cx="780" cy="170.7" r="5"/></g>

  <line x1="70" y1="300" x2="830" y2="300" stroke="#c3c2b7" stroke-width="1"/>
  <g font-size="12" fill="#52514e" text-anchor="middle">
    <text x="100" y="320">2000</text>
    <text x="236" y="320">2010</text>
    <text x="372" y="320">2020</text>
    <text x="508" y="320">2030</text>
    <text x="644" y="320">2040</text>
    <text x="780" y="320">2050</text>
  </g>

  <!-- 线端标注 -->
  <g font-size="11" font-weight="600" fill="#0b0b0b">
    <text x="790" y="146">东亚 51.6→65.3</text>
    <text x="790" y="163">美国 42.1→58.4</text>
    <text x="790" y="180">西欧 36.7→56.2</text>
  </g>
  <text x="790" y="196" font-size="11" fill="#898781">2020→2050(预测) %</text>

  <text x="24" y="344" font-size="11" fill="#898781">东亚指全球疾病负担(GBD)东亚区域；美国为高收入北美区域；实线为估计值，虚线为模型预测值</text>
</svg>
